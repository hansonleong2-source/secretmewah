<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>secretmewah — Connect. Share. Be Yourself.</title>
  <link rel="icon" href="assets/logo.jpeg" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" data-view="home">
        <img src="assets/logo.jpeg" alt="secretmewah logo" />
        <span>secretmewah</span>
      </a>

      <div class="top-search">
        <span>⌕</span>
        <input id="globalSearch" type="search" placeholder="Search people, posts, or hashtags..." />
      </div>

      <div class="top-actions">
        <button class="icon-btn active" data-view="home" title="Home">⌂</button>
        <button class="icon-btn" data-view="messages" title="Messages">✈</button>
        <button class="icon-btn notification-button" id="notificationBtn" title="Notifications">♧<b>3</b></button>
        <button class="mini-profile" id="profileMenuBtn">
          <span class="avatar avatar-self">S</span>
          <span class="chevron">⌄</span>
        </button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <nav class="main-nav">
          <button class="nav-item selected" data-view="home"><span>⌂</span> Home</button>
          <button class="nav-item" data-view="explore"><span>⌕</span> Explore</button>
          <button class="nav-item" data-view="messages"><span>▣</span> Messages <em>2</em></button>
          <button class="nav-item" data-view="notifications"><span>♧</span> Notifications <em>3</em></button>
          <button class="nav-item" data-action="open-create"><span>⊞</span> Create Post</button>
          <button class="nav-item" data-view="profile"><span>♙</span> Profile</button>
          <button class="nav-item" data-view="settings"><span>⚙</span> Settings</button>
        </nav>

        <div class="sidebar-bottom">
          <div class="dark-row">
            <span>☾</span> Dark Mode
            <label class="switch">
              <input id="themeToggle" type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>
          <div class="copyright">
            <strong>secretmewah</strong>
            <small>© 2025 secretmewah. All rights reserved.</small>
          </div>
        </div>
      </aside>

      <section class="content" id="content">
        <!-- rendered by script.js -->
      </section>

      <aside class="rightbar" id="rightbar">
        <!-- rendered by script.js -->
      </aside>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
</body>
</html>
