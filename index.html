<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>secretmewah — Connect. Share. Be Yourself.</title>
  <link rel="icon" href="assets/logo.jpeg">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand"><img src="assets/logo.jpeg" alt="secretmewah"><strong>secretmewah</strong></div>
      <p class="auth-tagline">Connect. Share. Be Yourself.</p>
      <div id="authMessage" class="auth-message hidden"></div>

      <form id="loginForm" class="auth-form">
        <h1>Welcome back</h1>
        <p>Log in to continue to secretmewah.</p>
        <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" required>
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
        <button class="primary-btn full" type="submit">Log in</button>
        <button class="text-btn" type="button" id="showSignup">Create a new account</button>
      </form>

      <form id="signupForm" class="auth-form hidden">
        <h1>Create account</h1>
        <p>Join the secretmewah community.</p>
        <input id="signupUsername" type="text" placeholder="Username" minlength="3" maxlength="24" required>
        <input id="signupDisplayName" type="text" placeholder="Display name" maxlength="40" required>
        <input id="signupEmail" type="email" placeholder="Email" autocomplete="email" required>
        <input id="signupPassword" type="password" placeholder="Password (8+ characters)" minlength="8" autocomplete="new-password" required>
        <button class="primary-btn full" type="submit">Sign up</button>
        <button class="text-btn" type="button" id="showLogin">Already have an account? Log in</button>
      </form>
    </div>
  </div>

  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <a class="brand" href="#" data-view="home">
        <img src="assets/logo.jpeg" alt="secretmewah logo"><span>secretmewah</span>
      </a>
      <div class="top-search"><span>⌕</span><input id="globalSearch" type="search" placeholder="Search people, posts, or hashtags..."></div>
      <div class="top-actions">
        <button class="icon-btn" data-view="home">⌂</button>
        <button class="icon-btn" data-view="messages">✈</button>
        <button class="icon-btn notification-button" data-view="notifications">♧<b id="notificationCount">0</b></button>
        <button class="mini-profile" data-view="profile"><span id="topAvatar" class="avatar avatar-self">S</span><span>⌄</span></button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <nav class="main-nav">
          <button class="nav-item selected" data-view="home"><span>⌂</span> Home</button>
          <button class="nav-item" data-view="explore"><span>⌕</span> Explore</button>
          <button class="nav-item" data-view="messages"><span>▣</span> Messages <em id="messageCount">0</em></button>
          <button class="nav-item" data-view="notifications"><span>♧</span> Notifications <em id="sideNotificationCount">0</em></button>
          <button class="nav-item" data-action="open-create"><span>⊞</span> Create Post</button>
          <button class="nav-item" data-view="profile"><span>♙</span> Profile</button>
          <button class="nav-item" data-view="settings"><span>⚙</span> Settings</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="dark-row"><span>☾</span> Dark Mode
            <label class="switch"><input id="themeToggle" type="checkbox"><span class="slider"></span></label>
          </div>
          <div class="copyright"><strong>secretmewah</strong><small>© 2026 secretmewah. All rights reserved.</small></div>
        </div>
      </aside>

      <section class="content" id="content"></section>
      <aside class="rightbar" id="rightbar"></aside>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal"><button class="modal-close" id="modalClose">×</button><div id="modalContent"></div></div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
</body>
</html>
